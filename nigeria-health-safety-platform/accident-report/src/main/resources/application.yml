server:
  port: 8082

spring:
  application:
    name: nigeria-health-accident-report

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nigeria_health_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_accident
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry-ms: 86400000
    refresh-token-expiry-ms: 604800000

  termii:
    api-key: ${TERMII_API_KEY}
    sender-id: NijaHealth

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: Nigeria Health Platform — Accident Report API
    version: 1.0.0

logging:
  level:
    com.nigeria.health: INFO
    org.springframework.security: WARN
