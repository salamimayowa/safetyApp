<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><title>Password Changed</title></head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:40px 0;">
  <table width="600" style="background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);">
    <tr><td style="background:#1a1a2e;padding:30px;text-align:center;">
      <h1 style="color:#fff;margin:0;">🔒 Password Changed Successfully</h1></td></tr>
    <tr><td style="padding:40px 30px;">
      <p style="color:#555;">Dear <strong th:text="${userName}">User</strong>,</p>
      <p style="color:#555;">Your password has been changed successfully. You can now log in with your new password.</p>
      <div style="background:#fff5f5;border-left:4px solid #e74c3c;padding:15px;border-radius:4px;margin:20px 0;">
        <strong style="color:#e74c3c;">⚠️ Was this not you?</strong>
        <p style="color:#555;margin:5px 0 0;">If you did not make this change, contact our support team immediately and reset your password.</p>
      </div>
    </td></tr>
    <tr><td style="background:#f8f8f8;padding:20px;text-align:center;border-top:1px solid #eee;">
      <p style="color:#aaa;font-size:12px;margin:0;">© 2025 Nigeria Health &amp; Safety Platform</p></td></tr>
  </table>
</td></tr></table>
</body></html>
