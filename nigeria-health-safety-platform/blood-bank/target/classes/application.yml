server:
  port: 8081

spring:
  application:
    name: nigeria-health-blood-bank

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nigeria_health_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway manages schema — JPA only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}       # your Gmail address
    password: ${MAIL_PASSWORD}       # Gmail App Password (not your real password)
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
      thread-name-prefix: async-

  scheduling:
    pool:
      size: 4

# ─── Custom App Config ──────────────────────────────────────────

app:
  jwt:
    secret: ${JWT_SECRET}                    # Base64 encoded 256-bit secret key
    access-token-expiry-ms: 86400000         # 24 hours
    refresh-token-expiry-ms: 604800000       # 7 days

  termii:
    api-key: ${TERMII_API_KEY}
    sender-id: NijaHealth                    # max 11 chars, registered on Termii

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  otp:
    expiry-minutes: 10
    max-attempts: 3

# ─── Springdoc / Swagger ────────────────────────────────────────

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: Nigeria Health & Safety Platform — Blood Bank API
    description: Blood stock management, donor registry, and blood request matching
    version: 1.0.0

# ─── Logging ────────────────────────────────────────────────────

logging:
  level:
    com.nigeria.health: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
