server:
  port: 8081

spring:
  application:
    name: nigeria-health-blood-bank

  profiles:
    default: dev            # used when no profile is set

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
      thread-name-prefix: async-

  scheduling:
    pool:
      size: 4

app:
  jwt:
    access-token-expiry-ms: 86400000
    refresh-token-expiry-ms: 604800000
  termii:
    sender-id: NijaHealth
  otp:
    expiry-minutes: 10
    max-attempts: 3

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.nigeria.health: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"